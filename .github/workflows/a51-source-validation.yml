name: A51 source validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Validate boot formats and native models
        run: |
          set -o pipefail
          python3 scripts/public-smoke.py 2>&1 | tee a51-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a51-source-validation
          path: |
            a51-validation.log
            validation/local/
          if-no-files-found: warn
